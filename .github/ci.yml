name: CI

on:
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: checkout repository
      - uses: actions/checkout@v4

      - name: Setup Node js
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Intall Dependencies
        run: npm ci

      - name: TS check
        run: npx tsc --noEmit

      - name: Eslint
        run: npx eslint .

      - name: Vitest test
        run: npx vitest --coverage
