name: CI

on:
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: day-5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: day-5/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TS check
        run: npx tsc --noEmit

      - name: ESLint
        run: npx eslint .

      - name: Vitest test
        run: npx vitest --coverage
